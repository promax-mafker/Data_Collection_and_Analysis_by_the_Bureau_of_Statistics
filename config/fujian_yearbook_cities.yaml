# 福建年鉴「各设区市」表采集配置（M9b 缺口补齐）
#
# 与 config/yearbook_volumes.yaml（泉州年鉴）的差别：
#   本表是「**地区为行、指标为列**」—— region 由**行内地区名**决定，
#   且**表内无年份**，year = 卷年 + year_offset。
#
# ⚠ 福建年鉴卷年 = 数据年 + 1（dz2022 卷载 2021 年数据）→ year_offset: -1
# ⚠ 卷入口规律实测 2015/2018/2020/2021/2022 可达；2023-2025 的 dz<年> 为 404，故未列。
# ⚠ 实测：**只有 dz2022 卷提供「各设区市固定资产投资」表**。其它可达年份该表不存在
#   （2015 只有「全社会固定资产投资」、2020/2021 只有「固定资产投资价格指数」）——
#   故这 4 卷会在 missing 里如实报缺失，属真实缺口而非抓取失败。
template: "https://tjj.fujian.gov.cn/tongjinianjian/dz{year}/contents-cn.htm"
years: [2015, 2018, 2020, 2021, 2022]
year_offset: -1

# 地区白名单：表内含「全 省」行，不登记则被当作地区入库
city_regions:
  福州市: 福州市
  厦门市: 厦门市
  莆田市: 莆田市
  三明市: 三明市
  泉州市: 泉州市
  漳州市: 漳州市
  南平市: 南平市
  龙岩市: 龙岩市
  宁德市: 宁德市

tables:
  # 4-7 各设区市固定资产投资额（首列=地区；列 2 = 投资额数值，列 3 = 比上年增长%）
  # 只取「数值」列：把「比上年增长（%）」当投资额入库是静默错值，刻意不映射。
  - key: inv
    title: "各设区市固定资产投资"
    columns:
      - { col: 2, name: "固定资产投资", unit: "亿元" }
