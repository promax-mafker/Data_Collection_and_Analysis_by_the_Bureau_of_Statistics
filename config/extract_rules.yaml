indicators:
  - name: 地区生产总值
    category: 综合
    unit: 亿元
    pattern: "(?<!人均)(?:地区生产总值|GDP)\\s*(?:达到|实现|完成|为|约|突破|达)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
    fallback: "(?<!人均)(?:地区生产总值|GDP)\\s*(?:达到|实现|完成|为|约|突破|达)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 第一产业增加值
    category: 综合
    unit: 亿元
    pattern: "第一产业增加值\\s*(?:达到|实现|完成|为|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 第二产业增加值
    category: 综合
    unit: 亿元
    pattern: "第二产业增加值\\s*(?:达到|实现|完成|为|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 第三产业增加值
    category: 综合
    unit: 亿元
    pattern: "第三产业增加值\\s*(?:达到|实现|完成|为|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 常住人口
    category: 人民生活
    unit: 万人
    pattern: "常住人口\\s*(?:为|达到|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万人)?"
    fallback: "(?<![镇村籍])常住人口\\s*(?:为|达到|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万人)?"
  - name: 居民人均可支配收入
    category: 人民生活
    unit: 元
    pattern: "(?:居民人均可支配收入|人均可支配收入)\\s*(?:为|达到|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>元)?"
  - name: 居民消费价格指数
    category: 人民生活
    unit: "%"
    pattern: "(?:居民消费价格|CPI).{0,6}(?P<value>[0-9]+(?:\\.[0-9]+)?)\\s*(?P<unit>%|％)?"
    fallback: "(?:居民消费价格指数|居民消费价格|CPI)[^0-9]{0,12}(?P<value>[0-9]+(?:\\.[0-9]+)?)\\s*(?P<unit>%|％)?"
  - name: 社会消费品零售总额
    category: 国内贸易
    unit: 亿元
    pattern: "社会消费品零售总额\\s*(?:达到|实现|完成|为|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 固定资产投资
    category: 固定资产投资
    unit: "%"
    pattern: "固定资产投资.{0,6}增长\\s*(?P<value>[0-9]+(?:\\.[0-9]+)?)\\s*(?P<unit>%|％)?"
    fallback: "固定资产投资[^0-9]{0,20}(?:增长|下降)\\s*(?P<value>[0-9]+(?:\\.[0-9]+)?)\\s*(?P<unit>%|％)?"
  - name: 进出口总额
    category: 对外经济
    unit: 亿元
    pattern: "(?:进出口总额|进出口)\\s*(?:达到|实现|完成|为|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 一般公共预算收入
    category: 财政金融
    unit: 亿元
    pattern: "(?:一般公共预算收入|地方一般公共预算收入)\\s*(?:达到|实现|完成|为|约)?\\s*(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 税收收入
    category: 财政金融
    unit: 亿元
    pattern: "税收收入(?!.{0,8}情况)[^0-9]{0,12}(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 非税收入
    category: 财政金融
    unit: 亿元
    pattern: "非税收入(?!.{0,8}情况)[^0-9]{0,12}(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 政府性基金收入
    category: 财政金融
    unit: 亿元
    pattern: "政府性基金(?:预算)?收入(?!.{0,8}情况)[^0-9]{0,12}(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 一般公共预算支出
    category: 财政金融
    unit: 亿元
    pattern: "(?:一般公共预算支出|地方一般公共预算支出)[^0-9]{0,12}(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 城镇新增就业
    category: 人民生活
    unit: 万人
    pattern: "城镇新增就业[^0-9]{0,12}(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万人)?"
  - name: 规模以上工业增加值
    category: 工业和建筑业
    unit: "%"
    pattern: "规模以上工业增加值[^0-9]{0,6}增长\\s*(?P<value>[0-9]+(?:\\.[0-9]+)?)\\s*(?P<unit>%|％)?"
  - name: 农林牧渔业总产值
    category: 农业
    unit: 亿元
    pattern: "(?:农林牧渔业总产值|农林牧渔业)[^0-9]{0,6}(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
  - name: 研究与试验发展经费
    category: 科学技术
    unit: 亿元
    pattern: "(?:研究与试验发展|R&D)[^0-9]{0,10}经费[^0-9]{0,6}(?P<value>[0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(?P<unit>万亿元|亿元|万元)?"
