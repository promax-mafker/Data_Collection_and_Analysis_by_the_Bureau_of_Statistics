# 统计年鉴采集配置（M9b）
#
# 设计约束：
#   P2 禁止硬编码定位 —— 表号会位移、文件名形态会变，一律从 TOC 按标题匹配。
#   P1 错 > 缺 —— 只映射语义确切的指标；单位不符或无法换算的值拒绝入库。
#
# `match` 按**正则 fullmatch** 匹配归一化后的行名（去 `#` 与 `N.` 编号）。
# 需要模糊时必须显式写 `.*`，让作者承担歧义风险（歧义会被 find_ambiguous_groups 暴露）。
region: 泉州市
template: "https://tjj.quanzhou.gov.cn/tsys/UpLoadFiles/43sjfb/129ndsj/qztjnj{year}/contents-cn.htm"
years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

tables:
  # 1—2 国民经济主要年份主要指标（宽表：年份为列）
  # 标题逐年漂移：2018/2022 卷为「国民经济主要指标」，2024 卷为「国民经济主要年份主要指标」
  - key: main
    title: "^国民经济主要(年份)?(主要)?指标$"
    indicators:
      - { match: "地区生产总值（当年价）", name: "地区生产总值", unit: "亿元" }
      - { match: "第一产业", name: "第一产业增加值", unit: "亿元" }
      - { match: "第二产业", name: "第二产业增加值", unit: "亿元" }
      - { match: "第三产业", name: "第三产业增加值", unit: "亿元" }
    # 注意：本表还含「1. 年末户籍人口数」——**户籍 ≠ 常住**，刻意不映射（P1）

  # 3—4 主要年份年末常住人口及人口变动（长表：年份为行）
  - key: pop
    title: 主要年份年末常住人口
    indicators:
      - { match: "常住人口.*", name: "常住人口", unit: "万人" }

  # 6—3 历年一般公共预算收支情况（长表 + 双层表头）
  # ⚠ 已**撤下映射**（2026-09-15）：该表标题与表内均无「全市/本级」标识，
  #   而同年在库值稳定只有公报（全市口径）的约一半：
  #     2022 393.91 vs 807.45 / 2023 437.68 vs 850.27 / 2024 402.37 vs 844.24
  #   ⇒ 高度疑为**市本级**口径。按 P1「错 > 缺」，宁可不上，也不冒充全市。
  #   正确做法：改用表 `0601「主要年份全国、全省、全市一般公共预算收支总额及增长速度」`
  #   （标题明确写「全市」），待核其形状后接入。
  # - key: fiscal
  #   title: "历年一般公共预算收支情况"
  #   indicators: [...]

  # 5—2 居民消费价格总指数（长表：metric 为 全省/全市/全国）
  # ⚠ 本表给出的是**指数（上年=100）**，而指标词典的「居民消费价格指数」单位是 %（涨幅）。
  #   两者语义不同，故映射为**独立指标名**，绝不混入既有指标（P1）。
  - key: cpi
    title: "历年全国、全省、全市居民消费价格(总)?指数"
    indicators:
      # metric 名逐年变化（实测：2020 卷叫「泉州」、2022/2024 卷叫「全市」），
      # 故写正则；仍限定本市口径。
      # ⚠ 2017/2018 卷该表解析器选到「上年=100 / 1985年=100」基期行，市级列缺失
      #   → 如实记为缺（不猜），见采集输出的 missing。
      - { match: "全市|市区|市辖区|泉州", name: "居民消费价格总指数", unit: "上年=100" }
